name: Publish MoneyTrail
on:
  push:
    branches: [main]
    paths:
      - 'MoneyTrail-0.9.5-Web-Site.zip'
      - 'MoneyTrail-0.9.5-Web-Loot-Update.zip'
      - 'tools/android_web_canvas.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: moneytrail-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Extract the website
        run: |
          unzip -q MoneyTrail-0.9.5-Web-Site.zip -d site
          test -s site/index.html
          test -s site/game/index.wasm.gz
      - name: Apply the Android browser canvas profile
        run: python3 tools/android_web_canvas.py site
      - name: Apply the loot performance update
        run: |
          unzip -oq MoneyTrail-0.9.5-Web-Loot-Update.zip -d site
          test -s site/game/index.pck
      - name: Add AdSense ownership verification
        run: |
          sed -i '/^<head>$/a\  <meta name="google-adsense-account" content="ca-pub-7726585830577046">' site/index.html
          grep -Fq '<meta name="google-adsense-account" content="ca-pub-7726585830577046">' site/index.html
      - name: Add AdSense ads.txt
        run: |
          printf '%s\n' 'google.com, pub-7726585830577046, DIRECT, f08c47fec0942fa0' > site/ads.txt
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
